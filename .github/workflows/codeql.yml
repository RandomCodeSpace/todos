name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 5 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # JavaScript scanning is enforced by the organization's default setup.
        language: [actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: never
      - name: Reject Actions security findings
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('codeql-results/actions.sarif', 'utf8'));
          const findings = report.runs.flatMap(run => run.results || []);
          for (const finding of findings) console.error(finding.message.text);
          console.log(`Actions security findings: ${findings.length}`);
          if (findings.length) process.exit(1);
          NODE
